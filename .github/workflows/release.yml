# Baut bei jedem Push auf main TreeSizeViewNG für Windows x64 und Linux x64 und legt daraus ein
# Release zum Herunterladen an. Lässt sich auch von Hand starten (Actions → "Release bauen" → Run workflow).
#
# Ablauf (ohne Actions-Artefakte, deren Speicher im Konto begrenzt ist):
#   1. Release-Entwurf anlegen (nur für Leute mit Schreibrecht sichtbar)
#   2. Windows und Linux bauen, jedes Paket direkt in den Entwurf hochladen
#   3. Release veröffentlichen – oder bei einem Fehler den Entwurf wieder löschen
#
# Versionsnummer: <VersionBase> aus TreeSizeViewNG.csproj plus Anzahl der Commits – jeder Commit
# zählt die letzte Stelle um 1 hoch. Dieselbe Nummer steht in der Titelleiste des Programms und
# im Namen der Pakete. Für einen Sprung auf 1.1.x nur <VersionBase> im csproj ändern.
#
# Gebaut wird wie lokal mit publish-windows.cmd: eigenständige Einzeldatei, ReadyToRun, unkomprimiert
# (schnellster Start), auf dem Zielrechner muss nichts installiert sein.
name: Release bauen

on:
  push:
    branches: [main]
    # Reine Änderungen an Startseite und Dokumentation ändern das Programm nicht: kein neues Release.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# Releases nacheinander anlegen (die laufende Nummer hängt vom vorigen ab), nichts abbrechen.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  entwurf:
    name: Version und Release-Entwurf
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # alle Commits: ihre Anzahl ist die letzte Stelle der Version
      - id: v
        name: Version bestimmen
        run: |
          base=$(sed -n 's:.*<VersionBase>\(.*\)</VersionBase>.*:\1:p' TreeSizeViewNG.csproj | head -n1)
          if [ -z "$base" ]; then echo "Keine <VersionBase> im csproj gefunden" >&2; exit 1; fi
          version="$base.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Entwurf anlegen
        run: |
          v=${{ steps.v.outputs.version }}
          # erneuter Lauf für denselben Commit: alten Stand ersetzen
          gh release delete "v$v" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$v" --draft \
            --target "$GITHUB_SHA" \
            --title "TreeSizeViewNG $v" \
            --generate-notes

  build:
    name: Bauen ${{ matrix.name }}
    needs: entwurf
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            rid: win-x64
          - name: Linux x64
            os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.entwurf.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # alle Commits: ihre Anzahl ist die letzte Stelle der Version
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Veröffentlichen
        shell: bash
        run: |
          dotnet publish TreeSizeViewNG.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output out \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=false \
            -p:PublishReadyToRun=true \
            -p:PublishTrimmed=false \
            -p:DebugType=None \
            -p:DebugSymbols=false
      - name: Paket in den Entwurf hochladen
        shell: bash
        run: |
          mkdir pakete
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd out && 7z a -tzip -mx=5 "../pakete/TreeSizeViewNG-$VERSION-windows-x64.zip" TreeSizeViewNG.exe > /dev/null)
          else
            # Ordner TreeSizeViewNG/ mit Programm, Symbol und einrichten.sh/entfernen.sh für den Menüeintrag
            mkdir -p linux/TreeSizeViewNG
            install -m 0755 out/TreeSizeViewNG packaging/linux/einrichten.sh packaging/linux/entfernen.sh linux/TreeSizeViewNG/
            install -m 0644 Assets/Icon.png linux/TreeSizeViewNG/treesizeviewng.png
            tar -czf "pakete/TreeSizeViewNG-$VERSION-linux-x64.tar.gz" -C linux TreeSizeViewNG
          fi
          ls -la pakete
          gh release upload "v$VERSION" pakete/* --clobber

  veroeffentlichen:
    name: Release veröffentlichen
    needs: [entwurf, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Entwurf veröffentlichen
        run: gh release edit "v${{ needs.entwurf.outputs.version }}" --draft=false --latest

  aufraeumen:
    name: Entwurf nach Fehler löschen
    needs: [entwurf, build]
    if: ${{ failure() && needs.entwurf.outputs.version != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Entwurf löschen
        run: gh release delete "v${{ needs.entwurf.outputs.version }}" --yes --cleanup-tag
