# Baut bei jedem Push auf main TreeSizeViewNG für Windows x64 und Linux x64 und legt daraus ein
# Release zum Herunterladen an. Lässt sich auch von Hand starten (Actions → "Release bauen" → Run workflow).
#
# Ablauf (ohne Actions-Artefakte, deren Speicher im Konto begrenzt ist):
#   1. Release-Entwurf anlegen (nur für Leute mit Schreibrecht sichtbar)
#   2. Windows und Linux bauen, jedes Paket direkt in den Entwurf hochladen
#   3. Release veröffentlichen – oder bei einem Fehler den Entwurf wieder löschen
#
# Versionsnummer: Haupt- und Nebenversion aus <Version> in TreeSizeViewNG.csproj, dazu eine laufende
# Nummer, die an das letzte Release dieser Reihe anschließt (erstes Release = .0).
# Beispiel: <Version>1.0.0</Version> → v1.0.0, v1.0.1, v1.0.2 …
# Für einen Sprung auf 1.1.x nur <Version> im csproj ändern.
#
# Gebaut wird wie lokal mit publish-windows.cmd: eigenständige Einzeldatei, ReadyToRun, unkomprimiert
# (schnellster Start), auf dem Zielrechner muss nichts installiert sein.
name: Release bauen

on:
  push:
    branches: [main]
    # Reine Änderungen an Startseite und Dokumentation ändern das Programm nicht: kein neues Release.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/startseite/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# Releases nacheinander anlegen (die laufende Nummer hängt vom vorigen ab), nichts abbrechen.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  entwurf:
    name: Version und Release-Entwurf
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Version bestimmen
        run: |
          base=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\..*</Version>.*:\1:p' TreeSizeViewNG.csproj | head -n1)
          if [ -z "$base" ]; then echo "Keine <Version> im csproj gefunden" >&2; exit 1; fi
          pattern="^v${base//./\\.}\\.([0-9]+)$"
          last=$(gh release list --limit 1000 --json tagName -q '.[].tagName' \
                 | sed -nE "s/${pattern}/\\1/p" | sort -n | tail -n1)
          if [ -z "$last" ]; then n=0; else n=$((last + 1)); fi
          version="$base.$n"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
      - name: Entwurf anlegen
        run: |
          v=${{ steps.v.outputs.version }}
          gh release create "v$v" --draft \
            --target "$GITHUB_SHA" \
            --title "TreeSizeViewNG $v" \
            --generate-notes

  build:
    name: Bauen ${{ matrix.name }}
    needs: entwurf
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            rid: win-x64
          - name: Linux x64
            os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.entwurf.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Veröffentlichen
        shell: bash
        run: |
          dotnet publish TreeSizeViewNG.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output out \
            -p:Version=$VERSION \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=false \
            -p:PublishReadyToRun=true \
            -p:PublishTrimmed=false \
            -p:DebugType=None \
            -p:DebugSymbols=false
      - name: Paket in den Entwurf hochladen
        shell: bash
        run: |
          mkdir pakete
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp out/TreeSizeViewNG.exe "pakete/TreeSizeViewNG-$VERSION-windows-x64.exe"
          else
            chmod +x out/TreeSizeViewNG
            tar -czf "pakete/TreeSizeViewNG-$VERSION-linux-x64.tar.gz" -C out TreeSizeViewNG
          fi
          ls -la pakete
          gh release upload "v$VERSION" pakete/* --clobber

  veroeffentlichen:
    name: Release veröffentlichen
    needs: [entwurf, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Entwurf veröffentlichen
        run: gh release edit "v${{ needs.entwurf.outputs.version }}" --draft=false --latest

  aufraeumen:
    name: Entwurf nach Fehler löschen
    needs: [entwurf, build]
    if: ${{ failure() && needs.entwurf.outputs.version != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Entwurf löschen
        run: gh release delete "v${{ needs.entwurf.outputs.version }}" --yes --cleanup-tag
