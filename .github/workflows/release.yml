# Baut bei jedem Push auf main TreeSizeViewNG für Windows x64 und Linux x64 und legt daraus ein
# Release zum Herunterladen an. Lässt sich auch von Hand starten (Actions → "Release bauen" → Run workflow).
#
# Versionsnummer: Haupt- und Nebenversion aus <Version> in TreeSizeViewNG.csproj, dazu eine laufende
# Nummer (erster Lauf = .0). Beispiel: <Version>1.0.0</Version> → v1.0.0, v1.0.1, v1.0.2 …
# Für einen Sprung auf 1.1.x nur <Version> im csproj ändern.
#
# Gebaut wird wie lokal mit publish-windows.cmd: eigenständige Einzeldatei, ReadyToRun, unkomprimiert
# (schnellster Start), auf dem Zielrechner muss nichts installiert sein.
name: Release bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases nacheinander anlegen, keinen laufenden Bau abbrechen.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    name: Version bestimmen
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version aus dem csproj plus laufende Nummer
        run: |
          base=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\..*</Version>.*:\1:p' TreeSizeViewNG.csproj | head -n1)
          if [ -z "$base" ]; then echo "Keine <Version> im csproj gefunden" >&2; exit 1; fi
          version="$base.$(( ${{ github.run_number }} - 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build:
    name: Bauen ${{ matrix.name }}
    needs: version
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            rid: win-x64
          - name: Linux x64
            os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Veröffentlichen
        shell: bash
        run: |
          dotnet publish TreeSizeViewNG.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --output out \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=false \
            -p:PublishReadyToRun=true \
            -p:PublishTrimmed=false \
            -p:DebugType=None \
            -p:DebugSymbols=false
      - name: Paket benennen
        shell: bash
        run: |
          v=${{ needs.version.outputs.version }}
          mkdir pakete
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp out/TreeSizeViewNG.exe "pakete/TreeSizeViewNG-$v-windows-x64.exe"
          else
            chmod +x out/TreeSizeViewNG
            tar -czf "pakete/TreeSizeViewNG-$v-linux-x64.tar.gz" -C out TreeSizeViewNG
          fi
          ls -la pakete
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: pakete/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release anlegen
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Release mit beiden Paketen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${{ needs.version.outputs.version }}
          ls -la pakete
          if gh release view "v$v" >/dev/null 2>&1; then
            # erneuter Lauf desselben Builds: Dateien ersetzen
            gh release upload "v$v" pakete/* --clobber
          else
            gh release create "v$v" pakete/* \
              --target "$GITHUB_SHA" \
              --title "TreeSizeViewNG $v" \
              --generate-notes
          fi
